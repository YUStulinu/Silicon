<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silicon pipeline viewer</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f3f4f6; --fg: #1f2328; --muted: #6b7280; --grid: #e5e7eb; --stripe: #f9fafb;
    --front: #93c5fd; --queue: #fcd34d; --exec: #34d399; --rob: #c4b5fd; --commit: #1f2937; --on-seg: #111827;
    --mispredict: #ef4444; --flush: #f59e0b; --window: rgba(59, 130, 246, 0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --fg: #e5e7eb; --muted: #8b93a1; --grid: #262b35; --stripe: #13161c;
      --front: #2f5f9e; --queue: #9a7a1f; --exec: #1f8f68; --rob: #5b4b9a; --commit: #e5e7eb; --on-seg: #f3f4f6;
      --mispredict: #f87171; --flush: #fbbf24; --window: rgba(96, 165, 250, 0.25);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 14px; background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  #status { padding: 6px 14px; color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 12px; padding: 0 14px 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 10px; margin-right: 4px; background: var(--c); vertical-align: -1px; }
  #spark { width: 100%; height: 56px; display: block; }
  #view { flex: 1; width: 100%; display: block; cursor: crosshair; }
  #tip { position: fixed; display: none; white-space: pre; background: var(--panel); border: 1px solid var(--grid);
         padding: 6px 8px; font: 12px ui-monospace, Menlo, Consolas, monospace; pointer-events: none; max-width: 380px; }
  button, input[type=number] { font: inherit; }
</style>
</head>
<body>
<header>
  <h1>Silicon pipeline</h1>
  <input type="file" id="file" accept=".trace,.txt">
  <button id="sample">Load the sample</button>
  <label>zoom <input type="range" id="zoom" min="2" max="24" value="12"></label>
  <label>go to cycle <input type="number" id="goto" min="0" style="width: 90px"></label>
  <label><input type="checkbox" id="hide"> hide squashed</label>
</header>
<div id="status">No trace loaded.</div>
<div class="legend">
  <span style="--c: var(--front)">F: front end</span>
  <span style="--c: var(--queue)">Q: waiting in the issue queue</span>
  <span style="--c: var(--exec)">E: executing</span>
  <span style="--c: var(--rob)">R: done, waiting to commit</span>
  <span style="--c: var(--commit)">C: commit</span>
  <span style="--c: var(--mispredict)">misprediction</span>
  <span style="--c: var(--flush)">flush</span>
</div>
<canvas id="spark"></canvas>
<canvas id="view"></canvas>
<div id="tip"></div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
